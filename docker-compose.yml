services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore
      POSTGRES_DB: encore
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
