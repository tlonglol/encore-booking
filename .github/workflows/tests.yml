name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Has to be real Postgres. The tests depend on the partial unique index and on how concurrent
    # transactions behave.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: encore
          POSTGRES_PASSWORD: encore
          POSTGRES_DB: encore_test
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encore"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+psycopg://encore:encore@localhost:5432/encore_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # No alembic step, the test suite runs the migrations itself.
      - run: pytest
